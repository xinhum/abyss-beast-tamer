<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊驯兽师 · Web Demo v1.0（表驱动）</title>
<style>
  :root{--bg:#0d1425;--panel:#182338;--panel2:#121c2f;--gold:#e0b040;--text:#e8ebf3;--mut:#94a0bc;--red:#d9534f;--green:#7fb069;--blue:#4d87d1;--purple:#a06ee0;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;}
  #app{max-width:980px;margin:0 auto;padding:16px;}
  h1{font-size:24px;color:var(--gold);margin:8px 0}
  .hud{display:flex;gap:14px;flex-wrap:wrap;background:var(--panel2);border:1px solid #2a3550;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
  .hud b{color:var(--gold)}
  .panel{background:var(--panel);border:1px solid #2a3550;border-radius:12px;padding:14px;margin-bottom:12px}
  .battle{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .card{background:var(--panel2);border:1px solid #33415f;border-radius:10px;padding:10px;cursor:pointer;transition:.15s;min-width:130px}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .card.disabled{opacity:.35;cursor:not-allowed;transform:none;border-color:#2a3550}
  .card .t{color:var(--gold);font-weight:bold;font-size:14px}
  .card .d{font-size:12px;color:var(--mut);margin-top:4px}
  .enemy{flex:1;min-width:150px;background:var(--panel2);border:1px solid #5a3a3a;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.12s}
  .enemy.sel{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
  .enemy.dead{opacity:.3}
  .petpanel{background:var(--panel2);border:1px solid #3a5a44;border-radius:10px;padding:10px}
  .bar{height:8px;background:#2a3145;border-radius:5px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--red)}
  .bar.pet>i{background:var(--green)} .bar.cd>i{background:var(--gold)}
  .btn{background:var(--gold);color:#20180a;border:none;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;color:var(--mut);border:1px solid #3a4560}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .log{font-size:13px;color:var(--mut);line-height:1.6;max-height:140px;overflow:auto;background:var(--panel2);border-radius:8px;padding:8px 12px}
  .logturn{color:#556080;font-size:11px;margin:4px 0 2px}
  .lg.me{color:#8fe0a0}.lg.crit{color:#e0b040;font-weight:bold}.lg.enemy{color:#e08a8a}.lg.bad{color:#e06a6a}.lg.sys{color:#94a0bc}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid #3a4560;color:var(--mut);margin-left:6px}
  .center{text-align:center}.big{font-size:18px;color:var(--gold);font-weight:bold;margin:10px 0 6px}
  .muted{color:var(--mut);font-size:13px}.count{color:var(--red);font-weight:bold}
  .capbox{border:1px solid var(--green);border-radius:12px;padding:14px}
  .atkbtn{flex:0 0 130px;background:#3a2f14;border:2px solid var(--gold)}
  #toastLayer{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:#1c2740;border:1px solid #4a5a80;color:#e8ebf3;padding:6px 14px;border-radius:20px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:tin .2s ease-out}
  .toast.good{border-color:#7fb069;color:#c6efb8}.toast.warn{border-color:#d9534f;color:#ffb3b0}
  .toast.out{animation:tout .3s ease-in forwards}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-8px)}}
  .floatnum{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-weight:bold;font-size:22px;z-index:70;pointer-events:none;animation:fup .7s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .floatnum.dmg{color:#8fe0a0}.floatnum.crit{color:#e0b040;font-size:28px}.floatnum.ult{color:#ffd36b;font-size:26px}.floatnum.hurt{color:#e08a8a}
  @keyframes fup{from{opacity:1}to{opacity:0;transform:translate(-50%,-42px)}}
  .modal{position:fixed;inset:0;background:rgba(5,8,16,.78);display:flex;align-items:center;justify-content:center;z-index:60}
  .modal>.panel{max-width:720px;width:93%;max-height:86vh;overflow:auto}

  /* ===== 层进度条 ===== */
  .topbar{background:var(--panel2);border:1px solid #2a3550;border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .progress{display:flex;gap:3px;align-items:center}
  .progress>i{flex:1;height:11px;border-radius:2px;background:#212b42;position:relative;transition:.25s}
  .progress>i.done{background:#c79a2e}
  .progress>i.cur{background:#ffe9a8;box-shadow:0 0 9px #e0b040,0 0 0 1px #e0b040}
  .progress>i.boss{background:#4a1f1f;height:15px;border-radius:3px}
  .progress>i.boss.done{background:#b5342f}
  .progress>i.boss.cur{background:#ff6b6b;box-shadow:0 0 11px #ff6b6b,0 0 0 1px #ff6b6b}
  .progress>i.boss:after{content:'☠';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;color:#f0c0c0;line-height:1}
  .statline{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px;gap:12px;flex-wrap:wrap}
  .statline .l{display:flex;gap:14px;flex-wrap:wrap}
  .statline b{color:var(--gold)}

  /* ===== 品质描边卡 ===== */
  .qcard{border-width:2px;border-style:solid}
  .nodecard{min-width:170px;padding:16px 14px;text-align:center}
  .nodecard .ico{font-size:26px;line-height:1.1}
  .nodecard .t{font-size:16px;margin-top:6px}
  .nodecard .d{font-size:12px;margin-top:4px}

  /* ===== 事件宠物展示 ===== */
  .petcard{background:var(--panel2);border-radius:10px;border-width:2px;border-style:solid;padding:12px 14px;min-width:210px}
  .petcard .nm{font-weight:bold;font-size:16px}
  .petcard .ln{font-size:13px;color:var(--mut);margin-top:5px}
</style>
</head>

// 品质相对倍率（由宠物表按同品质平均 HP / 平均 ATK 分别推算，不硬编码）
const QUAL_SCALE = (function(){
  const sh={}, sa={}, c={};
  for(const k in PETS){
    const d=PETS[k], q=d[2];
    sh[q]=(sh[q]||0)+(d[3]||0); sa[q]=(sa[q]||0)+(d[4]||0); c[q]=(c[q]||0)+1;
  }
  const baseH=(c['白']?sh['白']/c['白']:1)||1, baseA=(c['白']?sa['白']/c['白']:1)||1;
  const o={};
  for(const q in c) o[q]={ hp:(sh[q]/c[q])/baseH, atk:(sa[q]/c[q])/baseA };
  return o;
})();
function qualRatio(from, to){
  const a=QUAL_SCALE[from], b=QUAL_SCALE[to];
  if(!a||!b) return {hp:1, atk:1};
  return { hp: b.hp/a.hp, atk: b.atk/a.atk };
}

function segOf(n){ return Math.min(2, Math.floor((n-1)/8)); }
function isBossLv(n){ return META.bossLayers.indexOf(n)>=0; }
function layerOf(n, type){ return LAYER[n + (type==='elite'?'E':(type==='boss'?'B':'P'))] || LAYER[n+'P']; }
function petDef(pid){ return PETS[pid]; }
function mult(a,d){ if(a===d)return 1; if(BEATS[a]===d)return 1.5; if(BEATS[d]===a)return 0.75;
  if((a==='暗'&&d==='光')||(a==='光'&&d==='暗'))return 1.75; return 1; }
function counterText(el){ if(el==='暗')return '与 光 互克'; if(el==='光')return '与 暗 互克';
  const b=BEATS[el]; let by=null; for(const k in BEATS){ if(BEATS[k]===el){by=k;break;} }
  return '克制 '+(b||'—')+'，被 '+(by||'—')+' 克制'; }
// 简短彩色版（克制/被克属性用对应系别色，一眼可读）
function counterHtml(el){
  const c=x=>'<b style="color:'+elColor(x)+'">'+x+'</b>';
  if(el==='暗'||el==='光'){ const o=(el==='暗')?'光':'暗'; return '与 '+c(o)+' 互克'; }
  const b=BEATS[el]; let by=null; for(const k in BEATS){ if(BEATS[k]===el){by=k;break;} }
  return '克制 '+c(b||'—')+' · 被'+c(by||'—')+'克制';
}
function elColor(el){ return (ELEMREL[el]&&ELEMREL[el].color)||'#e8ebf3'; }
function relText(a,d){ const m=mult(a,d); if(m===1.75)return '互克'; if(m>1)return '克制'; if(m<1)return '被克'; return '无关系'; }
function relHtml(a,d){ const m=mult(a,d);
  if(m===1.75) return '<b style="color:#e0b040">互克</b>';
  if(m>1) return '<b style="color:#7fb069">我克制</b>';
  if(m<1) return '<b style="color:#d9534f">被克制</b>';
  return '<span style="color:var(--mut)">无关系</span>'; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function hpBar(cur,max,cls){ const p=Math.max(0,Math.min(100,Math.round(cur/max*100)||0));
  return '<div class="bar '+cls+'"><i style="width:'+p+'%"></i></div>'; }
function qColor(q){ return QCOLOR[q]||'#e8ebf3'; }

function pickWeighted(list, wi){
  if(!list.length) return null;
  let tot=0; list.forEach(x=> tot += (x[wi]||1));
  let r=Math.random()*tot;
  for(const x of list){ r -= (x[wi]||1); if(r<=0) return x; }
  return list[list.length-1];
}

// ============ Toast / 音效 / 飘字 ============
function toast(msg,type){ const tl=document.getElementById('toastLayer'); if(!tl||typeof tl.appendChild!=='function')return;
  const d=document.createElement('div'); d.className='toast '+(type||''); d.textContent=msg; tl.appendChild(d);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>{ if(d.parentNode)d.parentNode.removeChild(d); },300); },1600); }
function floatNum(txt,cls){ if(typeof document.createElement!=='function'||!document.body)return;
  const d=document.createElement('div'); d.className='floatnum '+(cls||'dmg'); d.textContent=txt;
  d.style.left=(50+(Math.random()*16-8))+'%'; document.body.appendChild(d);
  setTimeout(()=>{ if(d.parentNode)d.parentNode.removeChild(d); },700); }
let AC=null;
function initAudio(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C)AC=new C(); } }catch(e){} }
function sfx(name){ if(!AC)return; try{ const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.connect(g); g.connect(AC.destination); let f=300,d=.12,ty='square',v=.04;
  if(name==='crit'){f=680;d=.16;ty='sawtooth';v=.07;} else if(name==='ult'){f=200;d=.3;ty='sawtooth';v=.06;}
  else if(name==='hurt'){f=140;d=.12;ty='triangle';v=.05;} else if(name==='capture'){f=720;d=.25;ty='sine';v=.06;}
  else if(name==='win'){f=880;d=.4;ty='sine';v=.06;} else if(name==='lose'){f=110;d=.5;ty='sine';v=.06;}
  o.type=ty; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(Math.max(60,f*0.5),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.start(t); o.stop(t+d);
 }catch(e){} }

function kindOf(t){ if(t.indexOf('🐾')>=0)return 'me'; if(t.indexOf('💥')>=0)return 'crit';
  if(t.indexOf('💀')>=0)return 'bad'; if(t.indexOf(' 攻击 ')>=0)return 'enemy'; return 'sys'; }

    if(e.tn!==last){ out+='<div class="logturn">回合 '+e.tn+'</div>'; last=e.tn; }
    out+='<div class="lg '+e.kind+'">'+e.t+'</div>'; }

// ============ 宠物 ============
function mkPet(pid, opt){
  opt = opt || {};
  const d = petDef(pid);
  if(!d) return null;
  const ga = (S&&S.gAtk)||1, gh = (S&&S.gHp)||1;
  let hp = Math.round(d[3]*gh*(opt.weak?0.8:1));
  const affixId = opt.affix || null;
  const aff = affixId ? AFFIX.find(a=>a[0]===affixId) : null;
  const baseCd = 3;
  const cd = (aff && aff[1].indexOf('CD -1')>=0) ? 2 : baseCd;
  return { pid:pid, name:d[0], element:d[1], quality:d[2],
    atk:Math.round(d[4]*ga), hp:hp, maxHp:hp, cd:0, maxCd:cd,
    feedCd:0, orderCd:0, weak:!!opt.weak, affix:aff?aff[1]:'', affixId:affixId||'' };
}
function activePet(){ return S.team[S.active]; }
function allDead(){ return S.team.every(p=>p.hp<=0); }
function aliveEnemies(){ return S.enemies.filter(e=>e.hp>0); }

// ============ 敌人生成（按段池 + 构成模板） ============
function parseTemplate(tpl){
  if(!tpl) return [{role:'普通',n:1}];
  if(tpl.indexOf('Boss')>=0) return [{role:'Boss',n:1}];
  if(tpl.indexOf('/')>=0){
    const parts=tpl.split('/').map(s=>s.trim()).filter(Boolean);
    return parseTemplate(parts[Math.floor(Math.random()*parts.length)]);
  }
  const out=[];
  tpl.split('+').forEach(seg=>{
    const m=seg.trim().match(/(\d+)(?:\s*~\s*(\d+))?\s*(\S+)/);
    if(m){
      const a=parseInt(m[1],10), b=m[2]?parseInt(m[2],10):a;
      out.push({role:m[3], n:a+Math.floor(Math.random()*(b-a+1))});
    }
  });
  return out.length?out:[{role:'普通',n:1}];
}
function spawnEnemies(lv, type){
  const L = layerOf(lv, type);
  const seg = String(L.seg);
  const all = ESEG[seg] || [];
  const isElite = (type==='elite');
  const isBoss = (type==='boss');
  const list = [];
  if(isBoss){
    const bossDef = D.boss.find(b=>b[1]===lv);
    const eid = bossDef ? bossDef[0] : null;
    const e = eid ? ENEMIES[eid] : ['Boss','暗','Boss','Boss',150,24];
    const hp = Math.round(e[4]*L.coef*1.8);
    const atk = Math.round(e[5]*L.coef*1.2);
    list.push({name:bossDef?bossDef[2]:e[0], element:bossDef?bossDef[3]:e[1],
      hp:hp, maxHp:hp, atk:atk, boss:true, role:'Boss'});
    return list;
  }
  const usable = all.filter(x=> isElite ? x[1]==='精英' : x[1]==='普通');
  const template = parseTemplate(L.tpl);
  template.forEach(slot=>{
    const same = usable.filter(x=>{
      const e = ENEMIES[x[0]];
      return e && e[3]===slot.role;
    });
    const fallback = usable;
    const src = same.length ? same : fallback;
    for(let i=0;i<slot.n;i++){
      const pick = pickWeighted(src, 2) || src[0];
      if(!pick) break;
      const e = ENEMIES[pick[0]];
      const cntFactor = {1:1.0, 2:1.0, 3:0.82, 4:0.71}[Math.min(4, slot.n)] || 1.0;
      const eliteMul = isElite ? 1.2 : 1.0;
      const hp = Math.max(1, Math.round(e[4]*L.coef*cntFactor*eliteMul));
      const atk = Math.max(1, Math.round(e[5]*L.coef*cntFactor*eliteMul));
      list.push({ eid:pick[0], name:e[0], element:e[1], hp:hp, maxHp:hp, atk:atk, boss:false, role:e[3] });
    }
  });
  if(!list.length){
    const hp=Math.max(1,Math.round(150*L.coef)), atk=Math.max(1,Math.round(24*L.coef));
    list.push({name:'野兽','element':'火',hp:hp,maxHp:hp,atk:atk,boss:false,role:'普通'});
  }
  return list;
}

// ============ 捕获抽取 ============
function rollCapture(seg, eliteFlag){
  const list = POOL[String(seg)] || POOL['1'];
  const owned = {};
  S.team.forEach(p=> owned[p.pid]=true);
  let cand = list.filter(x=> !owned[x[0]]);
  if(!cand.length) cand = list;
  const pick = pickWeighted(cand, 2);
  const pid = pick[0];
  if(eliteFlag){
    const d = petDef(pid);
    const upq = QUP[d[2]];
    const alt = list.filter(x=> !owned[x[0]] && petDef(x[0])[2]===upq);
    if(alt.length) return alt[Math.floor(Math.random()*alt.length)][0];
  }
  return pid;
}

function petSelectScreen(){
  const list = POOL['1'];
  // 开局三选一：固定只出白色品质，且尽量三个不同系别（否则出现蓝宠就等于白送优势）
  const cands = [];
  const elsUsed = {};
  const shuffled = list.slice().sort(()=>Math.random()-0.5);
  for(const x of shuffled){
    const d = petDef(x[0]);
    if(!d) continue;
    if(d[2] !== '白') continue;
    if(elsUsed[d[1]]) continue;
    elsUsed[d[1]] = true; cands.push(x[0]);
    if(cands.length >= 3) break;
  }
  if(cands.length < 3){
    for(const x of shuffled){
      const d = petDef(x[0]);
      if(!d || d[2] !== '白') continue;
      if(cands.indexOf(x[0]) >= 0) continue;
      cands.push(x[0]);
      if(cands.length >= 3) break;
    }
  }
  let cs='';
  cands.forEach((pid,i)=>{
    const d=petDef(pid);
    cs+='<div class="card qcard" style="border-color:'+qColor(d[2])+'" onclick="chooseStarter('+i+')">'
      +'<div class="t" style="color:'+elColor(d[1])+'">'+d[0]+'</div>'
      +'<div class="d">'+d[1]+'系 · <b style="color:'+qColor(d[2])+'">'+d[2]+'</b></div>'
      +'<div class="d">ATK <b style="color:var(--text)">'+d[4]+'</b> · HP <b style="color:var(--text)">'+d[3]+'</b></div>'
      +'<div class="d">'+counterHtml(d[1])+'</div></div>';
  });
  window.__starterPids = cands;
  return '<div class="panel"><div class="big">选择初始宠物（三选一）</div>'
   + '<div class="muted">它的血条＝你的生命。首战必有一只被你克制。</div>'
   + '<div class="row" style="margin-top:12px">'+cs+'</div></div>';
}
function chooseStarter(i){

  if(!p) return;
  S.team=[p]; S.active=0; S.starterEl=p.element; S.screen='map'; render();

// ============ 节点 ============
function genNodes(layer){
  if(layer===1) return ['normal'];
  if(META.bossLayers.indexOf(layer+1)>=0) return Math.random()<0.5?['heal','shop']:['shop','heal'];
  const p = Math.min(0.35, 0.05 + 0.04*S.specialPity);
  const specials=['heal','shop','event'];
  const battles=['normal','elite'];
  const specialW = {heal:NODEW['回血祭坛']||5, shop:NODEW['黑市商店']||4, event:NODEW['事件']||5};
  const eliteW = NODEW['精英战']||32, normalW = NODEW['普通战']||54;
  function drawSpecial(){
    let tot=0; specials.forEach(k=>tot+=specialW[k]);
    let r=Math.random()*tot;
    for(const k of specials){ r-=specialW[k]; if(r<=0)return k; }
    return 'heal';
  }
  function drawOne(){
    if(Math.random()<p) return drawSpecial();
    return Math.random() < eliteW/(eliteW+normalW) ? 'elite':'normal';
  }
  let a=drawOne(), b=drawOne(), g=0;
  while(b===a && g<20){ b=drawOne(); g++; }
  if(b===a) b = (a==='normal')?'elite':(a==='elite'?'normal':(a==='heal'?'shop':'heal'));
  const isSp = x=> ['heal','shop','event'].indexOf(x)>=0;
  S.specialPity = (isSp(a)||isSp(b)) ? 0 : S.specialPity+1;
  return [a,b];
}

  normal:{t:'普通战斗', d:'标准敌人 · +'+SL_NORMAL+' SL'},
  elite:{t:'精英战斗', d:'敌人更强 · +'+SL_ELITE+' SL & 捕获 +1 档'},
  heal:{t:'回血祭坛', d:'全队回 '+Math.round(GROW.healNode*100)+'% 生命 · 跳过本层'},
  shop:{t:'黑市商店', d:'卖增益不卖血 · 跳过本层'},

};
const NODE_ICON = {normal:'⚔', elite:'💀', heal:'✚', shop:'🏪', event:'❓'};

function mapScreen(){
  if(isBossLv(S.layer)){
    const b = D.boss.find(x=>x[1]===S.layer);

function chooseNode(i){
  const n = (typeof i==='string') ? i : (S.nodeOptions?S.nodeOptions[i]:null);
  if(!n){ if(isBossLv(S.layer)) beginBattle('boss'); return; }
  if(n==='normal'||n==='elite') beginBattle(n);
  else if(n==='boss') beginBattle('boss');
  else if(n==='heal'){
    const r = GROW.healNode;
    S.team.forEach(p=>{ if(p.hp>0) p.hp=Math.min(p.maxHp, p.hp+Math.round(p.maxHp*r)); });
    toast('回血祭坛：全队回 '+Math.round(r*100)+'%','good'); advance();
  }
  else if(n==='shop') openShop();
  else if(n==='event') openEvent();
}
function advance(){
  S.layer++; S.nodeOptions=null;
  if(S.layer>S.total){ S.screen='result'; S.result='win'; sfx('win'); render(); return; }
  toast('进入第 '+S.layer+' 层'); S.screen='map'; render();
}

// ============ 战斗 ============
function beginBattle(type){
  const L = layerOf(S.layer, type);
  const elite = (type==='elite');
  S.turn=1; S.bossCharge=0; S.charging=false; S.turnDamage=0; S.shield=false;
  S.usedElite=elite; S.target=0; S.swapOpen=false; S.itemOpen=false; S.log=[];
  S.noCapture=false; S.pendingReward=0;
  S.enemies = spawnEnemies(S.layer, type);
  // 开局首战保底：至少 1 只被初始宠属性克制（教学用，让人第一场就吃到克制收益）
  if(S.firstBattle && S.starterEl && !isBossLv(S.layer)){
    const want = BEATS[S.starterEl];
    if(want && !S.enemies.some(e=>e.element===want)){
      S.enemies[0].element = want;
    }
    S.firstBattle = false;
  }
  // 古老契约等来源的「本段敌人血量衰减」
  if(S.enemyHpDebuff && S.enemyHpDebuff < 1){
    S.enemies.forEach(e=>{ e.maxHp = Math.max(1, Math.round(e.maxHp*S.enemyHpDebuff)); e.hp = e.maxHp; });
  }
  S.team.forEach(p=>{ p.cd = p.maxCd-1; p.feedCd=0; p.orderCd=0; });
  if(S.startShieldNext){ S.shield=true; S.startShieldNext=false; toast('护盾生效：下次受击减伤 50%','good'); }
  if(S.ultReadyCharges>0){ const a=activePet(); if(a) a.cd=0; S.ultReadyCharges--; toast('大招充能：已就绪（剩 '+S.ultReadyCharges+' 场）','good'); }
  S.screen='combat'; render();
}
function bossTick(){
  if(S.enemies.some(e=>e.boss&&e.hp>0)){
    if(!S.charging){ S.bossCharge++; if(S.bossCharge>=3){ S.charging=true; S.bossCharge=0; toast('⚠ Boss 蓄力，下回合需打断！','warn'); } }
  }
}
function targetEnemy(){
  let t=S.enemies[S.target];
  if(!t||t.hp<=0){ t=aliveEnemies()[0]; if(t) S.target=S.enemies.indexOf(t); }
  return t||null;
}
function setTarget(i){ if(S.enemies[i]&&S.enemies[i].hp>0){ S.target=i; render(); } }

function combatScreen(){
  const p=activePet();
  let eh='';
  S.enemies.forEach((e,i)=>{
    if(e.hp<=0){ return; }
    eh += '<div class="enemy '+(i===S.target?'sel':'')+'" onclick="setTarget('+i+')">'
      + '<div style="color:'+elColor(e.element)+';font-weight:bold">'+e.name+(e.boss?' · BOSS':'')+'</div>'
      + '<div class="tag">'+e.element+(e.role?' · '+e.role:'')+'</div>'
      + '<div class="muted">HP '+Math.max(0,e.hp)+'/'+e.maxHp+' · ATK '+e.atk+'</div>'
      + hpBar(e.hp,e.maxHp,'')
      + '<div class="muted" style="font-size:11px;margin-top:4px">对'+p.element+'：'+relHtml(p.element,e.element)+'</div></div>';
  });
  const petHtml = '<div class="petpanel qcard" style="border-color:'+qColor(p.quality)+'">'
    + '<div style="color:'+elColor(p.element)+';font-weight:bold">'+p.name
    + ' <span style="color:'+qColor(p.quality)+';font-size:12px">'+p.quality+'·'+p.element+'</span>'
    + (p.weak?' <span class="tag">虚弱</span>':'')+'</div>'
    + '<div class="muted">HP '+Math.max(0,p.hp)+'/'+p.maxHp+' · ATK <b style="color:var(--text)">'+p.atk+'</b></div>'
    + hpBar(p.hp,p.maxHp,'pet')
    + '<div class="muted" style="margin-top:6px">'+counterHtml(p.element)+'</div>'
    + '<div class="muted" style="margin-top:4px">词条：'+(p.affix||'无')+'</div>'
    + '<div class="muted" style="margin-top:6px">大招：'+(p.cd>0?('冷却 '+p.cd):'就绪')+'</div>'
    + hpBar(p.maxCd-p.cd,p.maxCd,'cd')
    + '<div class="muted" style="margin-top:8px">队伍：'+S.team.map(x=>x.name+(x.hp>0?'':'✝')).join(' / ')+'</div></div>';

  let acts = '<div class="card atkbtn" onclick="doAction(\'attack\',-1)"><div class="t">普攻</div><div class="d">宠物攻击当前目标</div></div>';
  CARD.forEach((c,i)=>{
    if(c[0]==='SK001') return;   // 普攻已单独做按钮
    let dis=false, cdTxt='';
    if(c[0]==='SK002' && p.cd>0){ dis=true; cdTxt=' · CD'+p.cd; }
    if(c[0]==='SK003' && p.orderCd>0){ dis=true; cdTxt=' · CD'+p.orderCd; }
    if(c[0]==='SK004' && p.feedCd>0){ dis=true; cdTxt=' · CD'+p.feedCd; }
    if(c[0]==='SK006' && p.defCd>0){ dis=true; cdTxt=' · CD'+p.defCd; }
    if(c[0]==='SK005' && S.team.length<2) dis=true;
    acts += '<div class="card '+(dis?'disabled':'')+'" onclick="doAction(\'skill\',\''+c[0]+'\')">'
      + '<div class="t">'+c[1]+'<span class="tag">'+c[2]+'</span></div>'
      + '<div class="d">'+c[3]+cdTxt+'</div></div>';
  });
  if(S.items.length){
    acts += '<div class="card" onclick="openItems()"><div class="t">道具<span class="tag">'+S.items.length+'</span></div>'
      + '<div class="d">'+S.items.map(x=>x.name).join(' / ')+'</div></div>';
  }
  return '<div class="panel"><div class="big">回合 '+S.turn
    + (S.charging?' · <span style="color:#d9534f">⚠ Boss 蓄力中</span>':'')
    + (S.defTurns>0?' · <span style="color:#4d87d1">🛡 减伤剩 '+S.defTurns+' 回合</span>':'')+'</div>'
    + '<div class="battle"><div>'+petHtml+'</div><div><div class="row">'+eh+'</div></div></div>'
    + '<div class="big">行动（每回合选 1 个）</div><div class="row">'+acts+'</div>'
    + '<div class="big" style="font-size:14px;margin-top:12px">战斗日志</div><div class="log">'+renderLog()+'</div></div>'
    + (S.swapOpen?swapModal():'')
    + (S.itemOpen?itemModal():'');
}

function swapModal(){
  const cur=activePet();
  const tgt=targetEnemy();
  let cards='';
  S.team.forEach((p,i)=>{
    const dead=p.hp<=0, isCur=i===S.active;
    const diff = cur ? (p.atk-cur.atk) : 0;
    const diffCol = diff>0 ? '#7fb069' : (diff<0 ? '#d9534f' : 'var(--mut)');
    const diffTxt = isCur ? '' :
      ' <span style="color:'+diffCol+'">('+(diff>0?'+':'')+diff+')</span>';
    cards += '<div class="card qcard '+(dead||isCur?'disabled':'')+'" style="border-color:'+qColor(p.quality)+'" onclick="doSwap('+i+')">'
      + '<div class="t" style="color:'+elColor(p.element)+'">'+p.name+(isCur?'（当前）':'')+'</div>'
      + '<div class="d">'+p.quality+'·'+p.element+' · HP '+Math.max(0,p.hp)+'/'+p.maxHp+'</div>'
      + hpBar(p.hp,p.maxHp,'pet')
      + '<div class="d">伤害 <b style="color:var(--text);font-size:14px">'+p.atk+'</b>'+diffTxt+'</div>'
      + '<div class="d">'+(tgt?('对'+tgt.name+'：'+relHtml(p.element,tgt.element)):'')+'</div>'
      + '<div class="d">'+counterHtml(p.element)+'</div>'
      + '<div class="d">词条：'+(p.affix||'无')+'</div>'
      + (dead?'<div class="d" style="color:#d9534f">已倒下</div>':'')+'</div>';
  });
  return '<div class="modal" onclick="if(event.target===this)cancelSwap()"><div class="panel">'
    + '<div class="big">选择要换上的宠物</div><div class="row">'+cards+'</div>'
    + '<div style="margin-top:14px;text-align:center"><button class="btn ghost" onclick="cancelSwap()">取消（不耗行动）</button></div></div></div>';
}
function openSwap(){ S.swapOpen=true; render(); }
function cancelSwap(){ S.swapOpen=false; render(); }
function doSwap(i){
  S.swapOpen=false;
  const np=S.team[i];
  if(!np||np.hp<=0||i===S.active){ render(); return; }
  const p=activePet();
  if(p){ if(p.cd>0)p.cd--; if(p.feedCd>0)p.feedCd--; if(p.orderCd>0)p.orderCd--; }
  S.active=i; log('切换到 '+S.team[i].name);
  resolveTurn();
}

function itemModal(){
  let cards='';
  S.items.forEach((it,i)=>{
    cards += '<div class="card" onclick="useItem('+i+')"><div class="t">'+it.name+'</div>'
      + '<div class="d">'+it.effect+'</div></div>';
  });
  return '<div class="modal" onclick="if(event.target===this)closeItems()"><div class="panel">'
    + '<div class="big">使用道具（消耗本回合行动）</div><div class="row">'+cards+'</div>'
    + '<div style="margin-top:12px"><button class="btn ghost" onclick="closeItems()">取消（不耗行动）</button></div></div></div>';
}
function openItems(){ if(!S.items.length)return; S.itemOpen=true; render(); }
function closeItems(){ S.itemOpen=false; render(); }
function useItem(i){
  const it=S.items[i];
  if(!it){ S.itemOpen=false; render(); return; }
  S.itemOpen=false;
  const p=activePet();
  const id=it.id;
  if(id==='PD001'){ const h=Math.round(p.maxHp*0.25); p.hp=Math.min(p.maxHp,p.hp+h); log('🧪 治疗药 +'+h); floatNum('+'+h,'dmg'); }
  else if(id==='PD002'){ S.buffAtkTemp=0.25; log('🧪 力量药：本场攻击 +25%'); }
  else if(id==='PD003'){ S.dmgReduceTemp=0.30; log('🧪 护盾符：本场受击 -30%'); }
  else if(id==='PD004'){ p.cd=0; log('🧪 净化符：大招就绪'); }
  else if(id==='PD006'){ if(S.enemies.some(e=>e.boss)){ S.charging=false; S.bossCharge=0; log('🧪 驱散符：清除敌方蓄力'); } else { log('🧪 驱散符：无目标，浪费了'); } }
  else if(id==='PD007'){ log('🧪 疾行符：额外一次宠物行动'); petAttack(1.0,1.0); }
  S.items.splice(i,1);
  if(aliveEnemies().length===0){ winBattle(); return; }
  resolveTurn();
}

function resolveTurn(){
  enemiesAct();
  const p=activePet();
  if(p && p.hp<=0) nextPet();
  const t=S.enemies[S.target];
  if(!t||t.hp<=0){ const a=aliveEnemies()[0]; if(a) S.target=S.enemies.indexOf(a); }
  if(allDead()){ S.screen='result'; S.result='lose'; sfx('lose'); render(); return; }
  if(S.defTurns>0) S.defTurns--;
  S.turn++;
  if(S.turn>40){ toast('战斗超时，判负','warn'); S.screen='result'; S.result='lose'; sfx('lose'); render(); return; }
  bossTick(); render();
}

function doAction(kind, arg){
  if(S.screen!=='combat'||S.swapOpen||S.itemOpen) return;
  let p=activePet();
  if(!p||p.hp<=0){
    nextPet(); p=activePet();
    if(!p||p.hp<=0){ S.screen='result'; S.result='lose'; sfx('lose'); render(); return; }
  }
  if(kind==='skill'){
    const c = CARD.find(x=>x[0]===arg);
    if(!c) return;
    if(c[0]==='SK002' && p.cd>0){ toast('大招冷却中','warn'); render(); return; }
    if(c[0]==='SK003' && p.orderCd>0){ toast('号令冷却中','warn'); render(); return; }
    if(c[0]==='SK004' && p.feedCd>0){ toast('喂食冷却中','warn'); render(); return; }
    if(c[0]==='SK006' && p.defCd>0){ toast('防御冷却中','warn'); render(); return; }
    if(c[0]==='SK005'){ if(S.team.length<2){ toast('只有一只宠物','warn'); render(); return; } openSwap(); return; }
  }
  if(p.cd>0)p.cd--; if(p.feedCd>0)p.feedCd--; if(p.orderCd>0)p.orderCd--; if(p.defCd>0)p.defCd--;
  S.turnDamage=0;
  if(kind==='attack') petAttack(1.0,1.0);
  else useSkill(arg);
  if(aliveEnemies().length===0){ winBattle(); return; }
  resolveTurn();
}

function critRoll(p){
  const base = (p.affixId==='AF001') ? 0.12 : 0;
  return Math.random() < base + (S.critBonus||0);
}
function petAttack(mul, extra){
  const p=activePet(), t=targetEnemy();
  if(!t) return;
  const buff = (S.buffAtkTemp||0) + (S.buffAtk||0);
  const cm = mult(p.element,t.element);
  let d = p.atk*mul*cm*rnd(0.95,1.05)*extra*(1+buff);
  if(cm>1 && S.counterBonus) d*=(1+S.counterBonus);
  const cr = critRoll(p); if(cr) d*=(S.critMul||2);
  d=Math.round(d); t.hp-=d; S.turnDamage+=d;
  floatNum(d, cr?'crit':'dmg'); sfx(cr?'crit':'hit');
  log('🐾 '+p.name+' 攻击 '+t.name+' '+d+(cr?'（暴击）':'')+(cm>1?'（克制）':''));
}
function useSkill(id){
  const p=activePet(), t=targetEnemy();
  if(!t) return;
  const buff = (S.buffAtkTemp||0) + (S.buffAtk||0);
  if(id==='SK002'){
    const cm = mult(p.element,t.element);
    let d = p.atk*2.5*cm*rnd(0.95,1.05)*(1+buff);
    if(cm>1 && S.counterBonus) d*=(1+S.counterBonus);
    const cr=critRoll(p); if(cr) d*=(S.critMul||2);
    d=Math.round(d); t.hp-=d; S.turnDamage+=d; p.cd=p.maxCd;
    floatNum(d,'ult'); sfx('ult'); log('💥 '+p.name+' 大招 '+d+(cr?'（暴击）':'')+'！'); return;
  }
  if(id==='SK003'){ p.orderCd=3; petAttack(1.0,1.3); return; }
  if(id==='SK004'){ const h=Math.round(p.maxHp*GROW.feedHeal); p.hp=Math.min(p.maxHp,p.hp+h); p.feedCd=3;
    floatNum('+'+h,'dmg'); log('🍖 '+p.name+' 回血 '+h); return; }
  if(id==='SK006'){ S.defTurns = GROW.defTurns; p.defCd = 1;
    log('🛡 防御：接下来 '+GROW.defTurns+' 回合，全部敌人伤害 -'+Math.round(GROW.defReduce*100)+'%'); return; }
}
function enemiesAct(){
  S.enemies.forEach(e=>{
    if(e.hp<=0) return;
    if(e.boss && S.charging){
      if(S.turnDamage>=e.maxHp*0.15){ log('✅ 打断蓄力！'); }
      else {
        const d=Math.round(e.maxHp*0.3);
        S.team.forEach(x=>{ if(x.hp>0) x.hp=Math.max(0,x.hp-d); });
        log('💢 未打断，全队受 '+d+' 重击','enemy'); floatNum(d,'hurt'); sfx('hurt');
      }
      S.charging=false; return;
    }
    const p=activePet();
    if(!p||p.hp<=0) return;
    let d = e.atk*mult(e.element,p.element)*rnd(0.95,1.05);
    if(p.affixId==='AF002') d*=0.92;
    if(S.affixReduce) d*=(1-S.affixReduce);
    if(S.dmgReduceTemp) d*=(1-S.dmgReduceTemp);
    if(S.defTurns>0) d*=(1-GROW.defReduce);   // 防御：所有敌人的攻击都减伤，不是只挡一次
    d=Math.round(d);
    if(S.shield){ d=Math.round(d*0.5); S.shield=false; }
    if(p.weak) d=Math.round(d*1.15);
    if(S.team.some(x=>x.hp>0)){
      p.hp-=d; log(e.name+' 攻击 '+p.name+' '+d+(S.defTurns>0?'（防御减伤）':''));
      if(S.thorns>0 && d>0){ const refl=Math.max(1,Math.round(d*S.thorns)); e.hp-=refl; log('🌵 荆棘反伤 '+refl); }
      if(p.hp<=0){ p.hp=0; log('💀 '+p.name+' 倒下'); nextPet(); }
    }
  });
  S.turnDamage=0;
}
function nextPet(){ const i=S.team.findIndex(p=>p.hp>0); if(i>=0) S.active=i; }

// ============ 结算 / 成长 ============
function killGrowth(){
  const seg = segOf(S.layer);
  const pct = GROW.killAtk[Math.min(2,seg)];
  S.team.forEach(p=>{ p.atk = Math.round(p.atk*(1+pct)); });
  S.gAtk *= (1+pct);
  S.kills++;
  const heal = GROW.killHeal;
  S.team.forEach(p=>{ if(p.hp>0) p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp*heal)); });
}
function bossGrowth(){
  const ga = GROW.bossAtk, gh = GROW.bossHp, hr = GROW.bossHeal;
  S.team.forEach(p=>{ p.atk=Math.round(p.atk*(1+ga)); p.maxHp=Math.round(p.maxHp*(1+gh)); });
  S.team.forEach(p=>{ if(p.hp>0) p.hp=Math.min(p.maxHp, p.hp+Math.round(p.maxHp*hr)); });
  S.gAtk*=(1+ga); S.gHp*=(1+gh);
  S.segCleared++; S.specialPity=0; S.enemyHpDebuff=1;
  toast('阶段奖励：全队 +'+Math.round(ga*100)+'% 攻/生命，回复 '+Math.round(hr*100)+'%','good');
}
function winBattle(){
  const isBoss = isBossLv(S.layer);
  const bonus = S.team.filter(p=>p.hp>0 && p.affixId==='AF003').length*6 + (S.perkSL||0);
  if(bonus>0){ S.sl+=bonus; toast('词条 +'+bonus+' SL','good'); }
  killGrowth();
  if(S.perkHeal){   // 换段词条「回春」：胜利后额外回血
    S.team.forEach(p=>{ if(p.hp>0) p.hp=Math.min(p.maxHp, p.hp+Math.round(p.maxHp*S.perkHeal)); });
  }
  if(S.noCapture){
    S.sl += S.pendingReward;
    toast('试炼通过，+'+S.pendingReward+' SL','good');
    advance(); return;
  }
  if(isBoss){
    S.sl += SL_BOSS; toast('击败 '+ (D.boss.find(b=>b[1]===S.layer)||['','','Boss'])[2] +'，+'+SL_BOSS+' SL','good');
    if(S.layer>=S.total){ S.screen='result'; S.result='win'; sfx('win'); render(); return; }
    bossGrowth(); openPerkPick(); return;
  }
  const gain = S.usedElite ? SL_ELITE : SL_NORMAL;
  S.sl += gain; toast('胜利，+'+gain+' SL','good');
  offerCapture();
}

// ============ 换段词条（直接取自 09_词条「换段」池 AF101–AF108） ============
const PERKS = AFFIX_PERK.map(a=>({ id:a[0], name:a[2], desc:a[3], val:a[4] }));

// 统一结算：换段池与事件池共用同一套效果
function applyTeamAffix(a){
  const ps = (String(a.val).match(/(\d+(?:\.\d+)?)%/g)||[]).map(s=>parseFloat(s)/100);
  const p0 = ps[0]||0, p1 = ps.length>1?ps[1]:p0;
  const id = a.id;
  switch(id){
    case 'AF101': case 'AF201': {            // 锋锐 / 深渊之握：攻击
      S.gAtk*=(1+p0); S.team.forEach(x=> x.atk=Math.round(x.atk*(1+p0))); break;
    }
    case 'AF102': case 'AF202': {            // 坚壁 / 不朽之躯：最大生命 + 回补
      S.gHp*=(1+p0);
      S.team.forEach(x=>{ const add=Math.round(x.maxHp*p0); x.maxHp+=add; if(x.hp>0) x.hp=Math.min(x.maxHp,x.hp+add); });
      break;
    }
    case 'AF103': { S.team.forEach(x=>{ x.maxCd=Math.max(2,x.maxCd-1); if(x.cd>x.maxCd)x.cd=x.maxCd; }); break; }
    case 'AF204': { S.team.forEach(x=>{ x.maxCd=Math.max(1,x.maxCd-2); if(x.cd>x.maxCd)x.cd=x.maxCd; }); break; }
    case 'AF104': { S.affixReduce=(S.affixReduce||0)+p0; break; }
    case 'AF105': case 'AF203': { S.perkSL=(S.perkSL||0)+Math.round(parseFloat(String(a.val).replace(/[^\d.]/g,''))||0); break; }
    case 'AF106': { S.counterBonus=(S.counterBonus||0)+p0; break; }
    case 'AF107': {
      S.gAtk*=(1+p0); S.gHp*=(1+p1);
      S.team.forEach(x=>{ x.atk=Math.round(x.atk*(1+p0)); const add=Math.round(x.maxHp*p1); x.maxHp+=add; if(x.hp>0)x.hp=Math.min(x.maxHp,x.hp+add); });
      break;
    }
    case 'AF108': { S.perkHeal=(S.perkHeal||0)+p0; break; }
    case 'AF205': { S.critBonus=(S.critBonus||0)+p0; S.critMul=2.2; break; }
    case 'AF206': { S.thorns=(S.thorns||0)+p0; break; }
    default: break;
  }
}

function openPerkPick(){
  const pool=PERKS.slice(), out=[];
  const owned = S.perks.slice();
  // 优先给没拿过的（可重复，但先保证 build 有变化）
  const fresh = pool.filter(p=> owned.indexOf(p.name)<0);
  const src = (fresh.length>=3? fresh : pool).slice();
  while(out.length<3 && src.length){ out.push(src.splice(Math.floor(Math.random()*src.length),1)[0]); }
  S.perkOptions=out; S.screen='perk'; render();
}
function perkScreen(){
  const cards=(S.perkOptions||[]).map((p,i)=>
    '<div class="card" onclick="choosePerk('+i+')"><div class="t">'+p.name+'</div><div class="d">'+p.desc+'</div></div>').join('');
  return '<div class="panel"><div class="big">换段词条 · 三选一</div>'
   + '<p class="muted">全队生效、整局保留，不占宠物词条位。</p>'
   + '<div class="row">'+cards+'</div></div>';
}
function choosePerk(i){
  const p=S.perkOptions && S.perkOptions[i];
  if(!p) return;
  S.perks.push(p.name);
  applyTeamAffix(p);
  S.perkOptions=null; toast('获得词条：'+p.name,'good'); advance();
}
function choosePerkDirect(p){
  S.perks.push(p.name);
  applyTeamAffix(p);
}
// 事件池（灵魂祭坛 / 遗忘神龛）抽一条
function randomEventAffix(){
  if(!AFFIX_EVENT.length) return null;
  return AFFIX_EVENT[Math.floor(Math.random()*AFFIX_EVENT.length)];
}

// ============ 捕获 ============
function captureScreen(){
  const c=S.capture;
  if(!c) return mapScreen();
  let rep='';
  if(c.fullTeam){
    rep = '<div style="margin-top:16px"><div class="big" style="font-size:15px">队伍已满 · 选择要用它替换掉的宠物</div><div class="row">'
      + S.team.map((p,i)=>'<div onclick="replaceWith('+i+')" style="cursor:pointer">'
        + petInfoCard(p, '<div class="ln" style="color:#d9534f;font-size:12px">点击替换掉它</div>') + '</div>').join('')+'</div></div>';
  }
  return '<div class="panel capbox"><div style="font-size:22px;color:var(--gold);font-weight:bold">捕获结算</div>'
    + '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:10px">'
      + '<div style="flex:1;min-width:280px">'
        + '<div style="font-size:28px;font-weight:bold;color:'+elColor(c.element)+'">'+c.name+'</div>'
        + '<div style="margin:10px 0;font-size:17px">品质 <b style="color:'+qColor(c.quality)+';font-size:22px">'+c.quality+'</b>　系别 <b style="color:'+elColor(c.element)+';font-size:20px">'+c.element+'</b></div>'
        + '<div style="font-size:16px">HP <b>'+c.hp+'</b> · ATK <b>'+c.atk+'</b></div>'
        + '<div style="font-size:16px;margin-top:4px">词条：'+c.affix+'</div>'
        + '<div style="font-size:16px;margin-top:8px">'+counterHtml(c.element)+'</div>'
        + '<div class="muted" style="font-size:13px;margin-top:6px">对我方出战宠：'+(activePet()?relHtml(activePet().element,c.element):'—')+'</div>'
      + '</div>'
      + '<div style="flex:0 0 250px;border-left:1px solid #2a3550;padding-left:16px">'
        + '<div style="font-size:16px">捕获价 <b style="color:var(--gold);font-size:24px">'+c.price+'</b> SL</div>'
        + '<div style="font-size:15px;margin-top:4px">当前 '+S.sl+' → 剩 '+(S.sl-c.price)+'</div>'
        + '<div class="count" style="font-size:20px;margin-top:8px">'+(c.paused?'⏸ 已暂停':'倒计时 '+c.left+'s')+'</div>'
        + '<button class="btn ghost" style="margin-top:8px" onclick="pauseCapture()">'+(c.paused?'继续':'暂停')+'</button>'
      + '</div>'
    + '</div>'
    + '<div class="row" style="margin-top:16px">'
      + (c.fullTeam?'':'<button class="btn" onclick="confirmCapture()">确认捕获</button>')
      + '<button class="btn ghost" onclick="afterCapture()">放弃</button></div>'
    + rep + '</div>';
}
function offerCapture(){
  const seg = segOf(S.layer)+1;
  const pid = rollCapture(seg, S.usedElite);
  const d = petDef(pid);
  if(!d){ advance(); return; }
  let q = d[2];
  if(S.captureBonus){ q = QUP[q]; S.captureBonus=0; }
  let price = d[5];
  const qr = (q!==d[2]) ? qualRatio(d[2], q) : {hp:1, atk:1};
  if(q!==d[2]){ price = Math.round(price*1.25); }
  if(S.captureDiscount){ price = Math.round(price*(1-S.captureDiscount)); S.captureDiscount=0; }
  if(S.freeCapture){ price=0; S.freeCapture=false; }
  // 捕获只会附加「宠物词条」，不会串到换段/事件池
  const aff = AFFIX_PET.length ? AFFIX_PET[Math.floor(Math.random()*AFFIX_PET.length)] : null;
  const tmp = mkPet(pid, {affix: aff?aff[0]:null});
  S.capture = { pid:pid, name:d[0], element:d[1], quality:q, price:price, qr:qr,
    hp: tmp?Math.round(tmp.maxHp*qr.hp):0, atk: tmp?Math.round(tmp.atk*qr.atk):0,
    left:10, affix: aff?aff[3]:'无', affixId: aff?aff[0]:'', paused:false, fullTeam:S.team.length>=TEAM_MAX };
  S.screen='capture';
  if(capT) clearInterval(capT);
  capT = setInterval(()=>{
    if(S.screen!=='capture'){ clearInterval(capT); capT=null; return; }
    if(S.capture.paused) return;
    S.capture.left--;
    if(S.capture.left<=0){ clearInterval(capT); capT=null; toast('捕获超时，放弃','warn'); afterCapture(); }
    render();
  },1000);
  render();
}
function pauseCapture(){ if(S.capture){ S.capture.paused=!S.capture.paused; render(); } }
function applyCaptureQuality(pet, c){
  if(!pet || c.quality===petDef(c.pid)[2]) return pet;
  const qr = c.qr || {hp:1, atk:1};
  pet.quality = c.quality;
  pet.maxHp = Math.round(pet.maxHp*qr.hp);
  pet.hp = pet.maxHp;
  pet.atk = Math.round(pet.atk*qr.atk);
  return pet;
}
function confirmCapture(){
  const c=S.capture;
  if(!c) return;
  if(c.fullTeam){ toast('队伍已满，请选择替换','warn'); render(); return; }
  if(S.sl<c.price){ toast('SL 不足，放弃','warn'); return afterCapture(); }
  S.sl-=c.price;
  const pet = applyCaptureQuality(mkPet(c.pid, {affix:c.affixId}), c);
  if(pet) S.team.push(pet);
  sfx('capture'); toast('捕获成功：'+c.name+'（'+c.quality+'·'+c.element+'）','good');
  afterCapture();
}
function replaceWith(i){
  const c=S.capture;
  if(!c||!S.team[i]) return;
  if(S.sl<c.price){ toast('SL 不足，放弃','warn'); return afterCapture(); }
  S.sl-=c.price;
  const old=S.team[i].name;
  const pet=applyCaptureQuality(mkPet(c.pid,{affix:c.affixId}), c);
  if(pet) S.team[i]=pet;
  if(S.active>=S.team.length) S.active=0;
  sfx('capture'); toast('用 '+c.name+' 替换 '+old,'good');
  afterCapture();
}
function afterCapture(){
  if(capT){ clearInterval(capT); capT=null; }
  S.capture=null; advance();
}

// ============ 商店（按 16_商店表 权重抽 3 项 + 1 个随机道具） ============
function pctOf(str, def){
  const m = String(str||'').match(/(\d+(?:\.\d+)?)\s*%/);
  return m ? parseFloat(m[1])/100 : (def||0);
}
function openShop(){
  const bought = S.shopBought || (S.shopBought = {});
  const pool = SHOP.filter(s=> !(s[6]==='否' && bought[s[0]]));
  const stock = [];
  const src = pool.slice();
  while(stock.length<3 && src.length){
    const pick = pickWeighted(src, 3);
    const idx = src.indexOf(pick);
    if(idx<0) break;
    src.splice(idx,1);
    stock.push({ id:pick[0], name:pick[1], desc:pick[5], price:pick[4], isItem:false, repeat:(pick[6]==='是') });
  }
  const it = ITEMS[Math.floor(Math.random()*ITEMS.length)];
  if(it) stock.push({ id:it[0], name:it[1], desc:it[3], price:it[4], isItem:true, repeat:true });
  S.shopStock = stock; S.screen='shop'; render();
}
function shopScreen(){
  let cs='';
  S.shopStock.forEach((s,i)=>{
    const afford = S.sl >= s.price;
    const full = s.isItem && S.items.length>=ITEMS_MAX();
    cs += '<div class="card '+((afford&&!full)?'':'disabled')+'" onclick="shopPick('+i+')">'
      + '<div class="t">'+s.name+(s.isItem?'<span class="tag">道具</span>':'')+'</div>'
      + '<div class="d">'+s.desc+'</div>'
      + '<div class="d">'+s.price+' SL'+(afford?'':'（不足）')+(full?'（道具位已满）':'')+'</div></div>';
  });
  cs += '<div class="card" onclick="leaveShop()"><div class="t">离开</div><div class="d">直接进入下一层</div></div>';
  return '<div class="panel"><div class="big">黑市商店（不卖血）</div>'
   + '<p class="muted">当前 SL：'+S.sl+' · 每次 3 个商品 + 1 个道具 · 可连续购买 · 道具位 '+S.items.length+'/'+ITEMS_MAX()+'</p>'
   + '<div class="row">'+cs+'</div></div>';
}
function ITEMS_MAX(){ return ITEM_MAX || 2; }
function shopPick(i){
  const s = S.shopStock[i];
  if(!s) return;
  if(S.sl < s.price){ toast('SL 不足','warn'); return; }
  if(s.isItem && S.items.length>=ITEMS_MAX()){ toast('道具位已满（最多 '+ITEMS_MAX()+' 个）','warn'); return; }
  S.sl -= s.price;
  if(s.isItem){
    S.items.push({ id:s.id, name:s.name, effect:s.desc });
    toast('购买道具：'+s.name,'good');
    render(); return;
  }
  const id = s.id;
  const v = pctOf(s.desc, 0);
  if(id==='IT001'){
    // 攻击强化：可重复购买、不设上限（数值从表里的效果文本解析）
    S.buffAtk = (S.buffAtk||0) + v;
    toast('全队攻击 +'+Math.round(v*100)+'%（累计 +'+Math.round(S.buffAtk*100)+'%）','good');
  }
  else if(id==='IT002'){ S.startShieldNext = true; toast('下场战斗开局护盾','good'); }
  else if(id==='IT003'){ S.freeCapture = true; toast('下次捕获免费','good'); }
  else if(id==='IT004'){ S.ultReadyCharges = 2; toast('下两场战斗大招就绪','good'); }
  else if(id==='IT005'){
    const p0 = v || 0.08;
    S.gAtk*=(1+p0); S.team.forEach(x=> x.atk=Math.round(x.atk*(1+p0)));
    S.perks.push('临时词条 +'+Math.round(p0*100)+'% 攻');
    toast('全队攻 +'+Math.round(p0*100)+'%','good');
  }
  else if(id==='IT006'){ S.revealNext = true; toast('情报卷轴：Boss 机制与下一层已可见','good'); }
  else if(id==='IT007'){ S.captureDiscount = v || 0.5; toast('下次捕获 -'+Math.round((v||0.5)*100)+'%','good'); }
  else if(id==='IT008'){
    const dead=S.team.find(x=>x.hp<=0);
    if(dead){ dead.hp=Math.round(dead.maxHp*(v||0.7)); toast(dead.name+' 以 '+Math.round((v||0.7)*100)+'% 生命复活','good'); }
    else { toast('没有倒下的宠物，白花了','warn'); }
  }
  if(!s.repeat){ (S.shopBought||(S.shopBought={}))[id]=true; S.shopStock.splice(i,1); }
  render();
}
function leaveShop(){ advance(); }

// ============ 事件（9 个） ============
const EVENT_IMPL = {
  EV001:{ title:'遗弃巢穴', desc:'一只虚弱但可用的宠物蜷缩在此。收编占用一个队伍位（最大生命 -20%）；队伍已满时由你选择替换掉谁。',
    opts:[
      {label:'收编', fn:()=>{
        const pet = S.eventPet;
        if(!pet){ toast('巢穴已空','warn'); advance(); return; }
        if(S.team.length >= TEAM_MAX){ S.eventReplace = true; render(); return; }
        S.team.push(pet);
        toast('收编 '+pet.name+'（虚弱）','good'); advance(); }},
      {label:'放弃', fn:()=>{ toast('离开遗弃巢穴'); advance(); }}
    ]},
  EV002:{ title:'强化台', desc:'花 60 SL，全队攻击与最大生命 +'+Math.round(GROW.forgeAtk*100)+'%（可叠加）。',
    opts:[
      {label:'强化（60 SL）', fn:()=>{
        if(S.sl<60){ toast('SL 不足','warn'); advance(); return; }
        const r = GROW.forgeAtk;
        S.sl-=60; S.gAtk*=(1+r); S.gHp*=(1+r);
        S.team.forEach(x=>{ x.atk=Math.round(x.atk*(1+r)); const add=Math.round(x.maxHp*r); x.maxHp+=add; if(x.hp>0)x.hp=Math.min(x.maxHp,x.hp+add); });
        toast('强化台：全队 +'+Math.round(r*100)+'% 攻/生命','good'); advance(); }},
      {label:'放弃', fn:()=>{ toast('离开强化台'); advance(); }}
    ]},
  EV003:{ title:'试炼之柱', desc:'接受一场特化战斗（3–4 只精英，单只 ×1.92）。危险，但回报丰厚。',
    opts:[
      {label:'接受挑战', fn:()=>{
        const L = layerOf(S.layer,'elite');
        const n = 3 + Math.floor(Math.random()*2);
        S.turn=1; S.bossCharge=0; S.charging=false; S.turnDamage=0; S.shield=false;
        S.usedElite=true; S.target=0; S.swapOpen=false; S.itemOpen=false; S.log=[];
        S.enemies=[];
        const seg=String(L.seg);
        const elites = (ESEG[seg]||[]).filter(x=>x[1]==='精英');
        for(let i=0;i<n;i++){
          const pick = pickWeighted(elites,2) || elites[0];
          if(!pick) break;
          const e=ENEMIES[pick[0]];
          const cntF={1:1,2:1,3:0.82,4:0.71}[Math.min(4,n)]||1;
          const hp=Math.max(1,Math.round(e[4]*L.coef*cntF*1.92));
          const atk=Math.max(1,Math.round(e[5]*L.coef*cntF*1.92));
          S.enemies.push({eid:pick[0],name:e[0],element:e[1],hp:hp,maxHp:hp,atk:atk,boss:false,role:'精英'});
        }
        S.team.forEach(p=>{ p.cd=p.maxCd-1; p.feedCd=0; p.orderCd=0; });
        S.screen='combat';
        S.pendingReward=180; S.noCapture=true; S.captureBonus=1;
        render(); }},
      {label:'拒绝', fn:()=>{ toast('拒绝试炼'); advance(); }}
    ]},
  EV004:{ title:'灵魂祭坛', desc:'献祭队伍中一只宠物，换取一条「事件词条」（强度高于换段档）。',
    opts:[
      {label:'献祭（选第一只）', fn:()=>{
        if(S.team.length<2){ toast('只剩一只，无法献祭','warn'); advance(); return; }
        const lost=S.team.shift(); if(S.active>=S.team.length)S.active=0;
        const aff = randomEventAffix();
        if(aff){ applyTeamAffix({id:aff[0], name:aff[2], val:aff[4]}); S.perks.push(aff[2]);
          toast('献祭 '+lost.name+'，获得「'+aff[2]+'」','good'); }
        advance(); }},
      {label:'离开', fn:()=>{ toast('离开祭坛'); advance(); }}
    ]},
  EV005:{ title:'迁徙兽群', desc:'把一只宠物免费换成「品质 +1 档」的随机宠。',
    opts:[
      {label:'交换（选第一只）', fn:()=>{
        const old=S.team[0];
        if(!old){ advance(); return; }
        const upq = QUP[old.quality];
        const seg=String(segOf(S.layer)+1);
        const cand=(POOL[seg]||[]).filter(x=> petDef(x[0])[2]===upq);
        const pid = cand.length ? cand[Math.floor(Math.random()*cand.length)][0] : rollCapture(segOf(S.layer)+1,true);
        const np=mkPet(pid);
        if(np){ S.team[0]=np; S.active=0; toast(old.name+' → '+np.name+'（'+np.quality+'）','good'); }
        advance(); }},
      {label:'离开', fn:()=>{ toast('离开兽群'); advance(); }}
    ]},
  EV006:{ title:'古老契约', desc:'花 70 SL，本段剩余敌人血量 -10%。',
    opts:[
      {label:'签订（70 SL）', fn:()=>{
        if(S.sl<70){ toast('SL 不足','warn'); advance(); return; }
        S.sl-=70; S.enemyHpDebuff=0.9; toast('契约生效：本段敌人血量 -10%','good'); advance(); }},
      {label:'离开', fn:()=>{ toast('离开契约'); advance(); }}
    ]},
  EV007:{ title:'遗忘神龛', desc:'随机获得一条你还没有的「事件词条」。',
    opts:[
      {label:'接受（随机）', fn:()=>{
        const owned = S.perks.slice();
        const pool = AFFIX_EVENT.filter(a=> owned.indexOf(a[2])<0);
        if(!pool.length){ toast('已集齐全部事件词条','warn'); }
        else {
          const a = pool[Math.floor(Math.random()*pool.length)];
          applyTeamAffix({id:a[0], name:a[2], val:a[4]});
          S.perks.push(a[2]);
          toast('获得词条：'+a[2],'good');
        }
        advance(); }},
      {label:'离开', fn:()=>{ toast('离开神龛'); advance(); }}
    ]},
  EV008:{ title:'荆棘陷阱', desc:'直接掉 25% 生命，换取 2 倍 SL。',
    opts:[
      {label:'踩下去', fn:()=>{
        S.team.forEach(p=>{ if(p.hp>0) p.hp=Math.max(1, p.hp - Math.round(p.maxHp*0.25)); });
        const gain=110; S.sl+=gain; toast('掉血换 '+gain+' SL','warn'); advance(); }},
      {label:'绕开', fn:()=>{ toast('绕开陷阱'); advance(); }}
    ]},
  EV009:{ title:'深渊赌局', desc:'押注 100 SL，50% 翻倍 / 50% 归零。',
    opts:[
      {label:'下注 100 SL', fn:()=>{
        if(S.sl<100){ toast('SL 不足','warn'); advance(); return; }
        S.sl-=100;
        if(Math.random()<0.5){ S.sl+=200; toast('赌局获胜！+200 SL','good'); }
        else { toast('赌局失败，100 SL 归零','warn'); }
        advance(); }},
      {label:'不赌', fn:()=>{ toast('离开赌局'); advance(); }}
    ]}
};

// 通用宠物信息卡（换宠 / 捕获替换 / 事件收编共用同一套信息展示）
function petInfoCard(p, extra){
  return '<div class="petcard" style="border-color:'+qColor(p.quality)+'">'
    + '<div class="nm" style="color:'+elColor(p.element)+'">'+p.name+'</div>'
    + '<div class="ln">'+p.quality+' · '+p.element+' 系'+(p.weak?' <span class="tag">虚弱</span>':'')+'</div>'
    + '<div class="ln">HP '+Math.max(0,p.hp)+'/'+p.maxHp+' · ATK <b style="color:var(--text)">'+p.atk+'</b></div>'
    + hpBar(p.hp,p.maxHp,'pet')
    + '<div class="ln">'+counterHtml(p.element)+'</div>'
    + '<div class="ln">词条：'+(p.affix||'无')+'</div>'
    + (extra||'') + '</div>';
}

function openEvent(){
  const list = EVENTS.slice();
  const pick = pickWeighted(list, 3) || list[0];
  S.event = EVENT_IMPL[pick[0]] || EVENT_IMPL.EV001;
  S.eventId = pick[0];
  S.eventReplace = false;
  S.eventPet = null;
  if(pick[0] === 'EV001'){
    const pid = rollCapture(segOf(S.layer)+1, false);
    if(pid) S.eventPet = mkPet(pid, {weak:true});
  }
  S.screen='event'; render();
}
function eventScreen(){
  const e = S.event;
  if(!e) return mapScreen();
  let body = '<div class="big">'+e.title+'</div><div class="muted">'+e.desc+'</div>';

  if(S.eventId === 'EV001' && S.eventPet && !S.eventReplace){
    body += '<div class="row" style="margin-top:14px">'+ petInfoCard(S.eventPet) +'</div>';
  }
  if(S.eventReplace){
    body += '<div class="big" style="font-size:15px;margin-top:16px">队伍已满 · 选择要替换掉的宠物</div>'
      + '<div class="row">'
      + S.team.map((p,i)=>'<div onclick="eventReplaceWith('+i+')" style="cursor:pointer">'+petInfoCard(p)+'</div>').join('')
      + '</div>'
      + '<div style="margin-top:16px;text-align:center"><button class="btn ghost" onclick="eventCancelCollect()">取消</button></div>';
  } else {
    body += '<div style="margin-top:18px;text-align:center">'
      + e.opts.map((o,i)=>'<button class="btn'+(i?' ghost':'')+'" style="margin:0 7px" onclick="eventPick('+i+')">'+o.label+'</button>').join('')
      + '</div>';
  }
  return '<div class="panel">'+body+'</div>';
}
function eventPick(i){
  const e=S.event;
  if(!e) return;
  const o=e.opts[i];
  if(!o) return;
  o.fn();
}
function eventReplaceWith(i){
  const pet = S.eventPet;
  if(!pet || !S.team[i]) return;
  const old = S.team[i].name;
  S.team[i] = pet;
  S.eventReplace = false;
  if(S.active >= S.team.length) S.active = 0;
  toast(pet.name+' 替换了 '+old,'good');
  advance();
}
function eventCancelCollect(){ S.eventReplace=false; render(); }

// ============ 结果 ============
function resultScreen(){
  const win=S.result==='win';
  const lastBoss = (D.boss.find(b=>b[1]===S.total)||['','','Boss'])[2];
  return '<div class="panel center"><h1>'+(win?'🏆 通关！':'💀 全队倒下')+'</h1>'
   + '<p class="muted">'+(win?('你击败了 '+lastBoss+'。'):'再来一次：血条跨战斗保留，补给节点该拿就拿。')+'</p>'
   + '<p class="muted">模式：'+(S.mode==='full'?'完整爬塔 24 层':'试玩段 8 层')
   + ' · 层数：'+Math.min(S.layer,S.total)+'/'+S.total
   + ' · 击杀：'+S.kills+' · 最终 SL：'+S.sl+' · 队伍：'+S.team.length+'/3</p>'
   + '<p class="muted">本局词条：'+(S.perks.length?S.perks.join(' / '):'无')+'</p>'
   + '<button class="btn" onclick="startGame(\''+S.mode+'\')">再来一次</button> '
   + '<button class="btn ghost" onclick="startGame(\'trial\')">回到开始</button></div>';
}

// ============ 入口 ============
function startGame(mode){ initAudio(); newGame(mode); S.screen='petselect'; render(); }

window.startGame=startGame; window.chooseStarter=chooseStarter; window.chooseNode=chooseNode;
window.doAction=doAction; window.setTarget=setTarget; window.openSwap=openSwap;
window.cancelSwap=cancelSwap; window.doSwap=doSwap;
window.confirmCapture=confirmCapture; window.afterCapture=afterCapture;
window.pauseCapture=pauseCapture; window.replaceWith=replaceWith;
window.shopPick=shopPick; window.leaveShop=leaveShop; window.eventPick=eventPick;
window.eventReplaceWith=eventReplaceWith; window.eventCancelCollect=eventCancelCollect;
window.choosePerk=choosePerk; window.openItems=openItems; window.closeItems=closeItems; window.useItem=useItem;

newGame('trial'); render();
</script>
